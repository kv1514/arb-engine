name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install cryptography
      - run: python -m unittest discover -s tests -t . -v
      - run: python scripts/render_results.py --check
      - run: python -m arb_engine fees --venue kalshi --price 0.5 --contracts 100
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bash scripts/test_js.sh
      - run: python3 scripts/check_extension.py extension
      - run: bash scripts/package_extension.sh
